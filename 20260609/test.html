<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夏の宴 - 動くお品書き</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      font-family: 'Noto Serif JP', serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ========== Canvas背景（金の粒子アニメーション） ========== */
    #bgCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ========== ローディング画面 ========== */
    #loading {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0a0a0f, #1a1408);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s ease;
    }

    .loading-kanji {
      font-size: 80px;
      color: #b8860b;
      animation: loadingPulse 1.5s ease-in-out infinite;
      text-shadow: 0 0 30px rgba(184,134,11,0.8);
    }

    .loading-bar-wrap {
      width: 200px;
      height: 2px;
      background: rgba(184,134,11,0.2);
      margin-top: 30px;
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar {
      height: 100%;
      background: linear-gradient(to right, #b8860b, #ffd700);
      width: 0%;
      animation: loadingBar 1.8s ease forwards;
    }

    @keyframes loadingPulse {
      0%,100% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes loadingBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* ========== メインコンテナ ========== */
    #main {
      position: relative;
      z-index: 1;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #main.visible { opacity: 1; }

    /* ========== ヒーローセクション ========== */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
    }

    .hero-season {
      font-size: 12px;
      letter-spacing: 8px;
      color: #b8860b;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 1s ease 2.2s forwards;
    }

    .hero-title {
      font-size: clamp(60px, 12vw, 120px);
      font-weight: 300;
      color: #fdf8f0;
      letter-spacing: 20px;
      text-indent: 20px;
      line-height: 1;
      opacity: 0;
      animation: fadeUp 1s ease 2.4s forwards;
      text-shadow: 0 0 60px rgba(184,134,11,0.3);
      position: relative;
    }

    .hero-title::after {
      content: '夏の宴';
      position: absolute;
      inset: 0;
      color: transparent;
      -webkit-text-stroke: 1px rgba(184,134,11,0.4);
      animation: glowPulse 3s ease-in-out infinite;
    }

    .hero-sub {
      font-size: 14px;
      color: rgba(184,134,11,0.8);
      letter-spacing: 4px;
      margin-top: 20px;
      opacity: 0;
      animation: fadeUp 1s ease 2.6s forwards;
    }

    .scroll-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      animation: fadeUp 1s ease 3.2s forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .scroll-hint span {
      font-size: 11px;
      letter-spacing: 4px;
      color: rgba(184,134,11,0.6);
    }

    .scroll-arrow {
      width: 20px;
      height: 20px;
      border-right: 1px solid rgba(184,134,11,0.6);
      border-bottom: 1px solid rgba(184,134,11,0.6);
      transform: rotate(45deg);
      animation: scrollBounce 1.5s ease-in-out infinite;
    }

    @keyframes scrollBounce {
      0%,100% { transform: rotate(45deg) translateY(0); opacity: 0.6; }
      50% { transform: rotate(45deg) translateY(5px); opacity: 1; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glowPulse {
      0%,100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    /* ========== メニューセクション ========== */
    .menu-section {
      padding: 60px 20px 100px;
      max-width: 700px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 60px;
    }

    .section-header h2 {
      font-size: 13px;
      letter-spacing: 8px;
      color: #b8860b;
      margin-bottom: 12px;
    }

    .section-header p {
      font-size: 12px;
      color: rgba(253,248,240,0.4);
      letter-spacing: 3px;
    }

    /* ========== メニューカード ========== */
    .menu-card {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 0;
      margin-bottom: 2px;
      background: rgba(253,248,240,0.03);
      border: 1px solid rgba(184,134,11,0.15);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      transform: translateX(-30px);
      transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
      position: relative;
    }

    .menu-card.in-view {
      opacity: 1;
      transform: translateX(0);
    }

    .menu-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0;
      width: 3px;
      height: 0%;
      background: linear-gradient(to bottom, #b8860b, #ffd700);
      transition: height 0.4s ease;
    }

    .menu-card:hover::before { height: 100%; }

    .menu-card:hover {
      background: rgba(184,134,11,0.06);
      border-color: rgba(184,134,11,0.4);
      transform: translateX(6px);
    }

    /* イラストエリア */
    .card-canvas-wrap {
      width: 110px;
      height: 110px;
      background: rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(184,134,11,0.15);
      position: relative;
      overflow: hidden;
    }

    .card-canvas-wrap canvas {
      position: absolute;
    }

    /* テキストエリア */
    .card-body {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .card-course {
      font-size: 10px;
      letter-spacing: 4px;
      color: #b8860b;
      font-weight: 600;
    }

    .card-name {
      font-size: 20px;
      color: #fdf8f0;
      letter-spacing: 2px;
      font-weight: 300;
    }

    .card-note {
      font-size: 12px;
      color: rgba(253,248,240,0.45);
      letter-spacing: 1px;
      line-height: 1.6;
    }

    .card-number {
      position: absolute;
      right: 20px;
      bottom: 15px;
      font-size: 48px;
      font-weight: 700;
      color: rgba(184,134,11,0.06);
      letter-spacing: -2px;
      line-height: 1;
      pointer-events: none;
    }

    /* ========== モーダル ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      background: linear-gradient(160deg, #1a1408, #0f0d08);
      border: 1px solid rgba(184,134,11,0.4);
      border-radius: 4px;
      padding: 50px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .modal-overlay.open .modal-box {
      transform: scale(1) translateY(0);
    }

    .modal-course {
      font-size: 11px;
      letter-spacing: 5px;
      color: #b8860b;
      margin-bottom: 16px;
    }

    .modal-name {
      font-size: 28px;
      color: #fdf8f0;
      letter-spacing: 3px;
      font-weight: 300;
      margin-bottom: 20px;
    }

    .modal-divider {
      width: 60px;
      height: 1px;
      background: rgba(184,134,11,0.5);
      margin: 0 auto 20px;
    }

    .modal-desc {
      font-size: 14px;
      color: rgba(253,248,240,0.6);
      letter-spacing: 1px;
      line-height: 2;
    }

    .modal-close {
      margin-top: 30px;
      font-size: 11px;
      letter-spacing: 4px;
      color: rgba(184,134,11,0.6);
      cursor: pointer;
      border: 1px solid rgba(184,134,11,0.3);
      padding: 10px 24px;
      display: inline-block;
      transition: all 0.3s;
    }

    .modal-close:hover {
      background: rgba(184,134,11,0.1);
      color: #b8860b;
    }

    /* ========== レスポンシブ ========== */
    @media (max-width: 500px) {
      .menu-card { grid-template-columns: 85px 1fr; }
      .card-canvas-wrap { width: 85px; height: 85px; }
      .card-name { font-size: 16px; }
      .card-body { padding: 15px 16px; }
      .modal-box { padding: 35px 24px; }
      .modal-name { font-size: 22px; }
      .hero-title { font-size: 50px; letter-spacing: 10px; }
    }
  </style>
</head>
<body>

<!-- ローディング -->
<div id="loading">
  <div class="loading-kanji">宴</div>
  <div class="loading-bar-wrap">
    <div class="loading-bar"></div>
  </div>
</div>

<!-- 背景Canvas（金の粒子） -->
<canvas id="bgCanvas"></canvas>

<!-- メイン -->
<div id="main">

  <!-- ヒーロー -->
  <section class="hero">
    <div class="hero-season">SUMMER KAISEKI  2026</div>
    <h1 class="hero-title">夏の宴</h1>
    <p class="hero-sub">〜 旬を愉しむ和のひととき 〜</p>
    <div class="scroll-hint" onclick="document.querySelector('.menu-section').scrollIntoView({behavior:'smooth'})">
      <span>MENU</span>
      <div class="scroll-arrow"></div>
    </div>
  </section>

  <!-- メニュー -->
  <section class="menu-section">
    <div class="section-header">
      <h2>お 品 書 き</h2>
      <p>— 各料理をタップすると詳細をご覧いただけます —</p>
    </div>

    <div id="menuList"></div>
  </section>

</div>

<!-- モーダル -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-box" id="modalBox">
    <canvas class="modal-canvas" id="modalCanvas" width="420" height="300"></canvas>
    <div class="modal-course" id="modalCourse"></div>
    <div class="modal-name" id="modalName"></div>
    <div class="modal-divider"></div>
    <div class="modal-desc" id="modalDesc"></div>
    <div class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">
      ✕  と じ る
    </div>
  </div>
</div>

<script>
// ========== メニューデータ ==========
const MENU = [
  {
    course: '冷 菜',
    name: '彩り夏野菜のサラダ',
    note: '旬の恵みを和風ジュレで爽やかに',
    desc: '色とりどりの夏野菜を丁寧に仕込み\n柑橘香る和風ジュレで涼やかに仕上げました\n夏の始まりを彩る一皿です',
    draw: drawSalad,
    color: '#4caf50'
  },
  {
    course: '酢の物',
    name: '烏賊と胡瓜の酢和え',
    note: 'やわらかな烏賊と胡瓜を涼やかな土佐酢で',
    desc: '肉厚なやわらかな烏賊と\n蛇腹に切った胡瓜を土佐酢で和えました\n夏らしい涼味をお楽しみください',
    draw: drawIka,
    color: '#7986cb'
  },
  {
    course: '強 肴',
    name: '実山椒と合鴨のソテー',
    note: '香ばしく焼き上げた鴨にピリリと山椒の香り',
    desc: '丁寧に下処理した合鴨を香ばしくソテーし\n有馬の実山椒をたっぷりと添えました\nピリリとした刺激が食欲をそそります',
    draw: drawDuck,
    color: '#8d6e63'
  },
  {
    course: '焼 物',
    name: '鯛の塩釜焼き',
    note: '一尾まるごと 潮の香りとともに豪快に',
    desc: '天然真鯛を一尾まるごと塩で包み\nじっくりと焼き上げました\nテーブルで割る演出もお楽しみください',
    draw: drawTai,
    color: '#ff7043'
  },
  {
    course: '食 事',
    name: '鯛の炊き込みごはん',
    note: '土鍋でふっくら炊き上げた鯛の旨みたっぷり',
    desc: '先ほどの鯛の旨みを余すことなく\n土鍋の炊き込みごはんに仕上げました\n鯛のだしが染み渡る締めの一品です',
    draw: drawRice,
    color: '#ffb74d'
  },
  {
    course: '甘 味',
    name: '焼き立てシフォンケーキ',
    note: 'ふわりと香るやさしい甘さで締めくくりに',
    desc: 'オーブンから出したてのシフォンケーキを\n季節のフルーツと生クリームとともに\nやさしい甘さで宴の幕を閉じます',
    draw: drawCake,
    color: '#f48fb1'
  }
];

// ========== 背景パーティクル ==========
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];
let W, H;

function resizeBg() {
  W = bgCanvas.width  = window.innerWidth;
  H = bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg);

class Particle {
  constructor() { this.reset(true); }
  reset(init = false) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 10;
    this.size = Math.random() * 1.5 + 0.3;
    this.speed = Math.random() * 0.4 + 0.1;
    this.opacity = Math.random() * 0.5 + 0.1;
    this.drift = (Math.random() - 0.5) * 0.3;
    this.twinkle = Math.random() * Math.PI * 2;
  }
  update() {
    this.y -= this.speed;
    this.x += this.drift;
    this.twinkle += 0.03;
    this.currentOpacity = this.opacity * (0.6 + 0.4 * Math.sin(this.twinkle));
    if (this.y < -10) this.reset();
  }
  draw() {
    bgCtx.save();
    bgCtx.globalAlpha = this.currentOpacity;
    bgCtx.fillStyle = '#b8860b';
    bgCtx.shadowBlur = 4;
    bgCtx.shadowColor = '#ffd700';
    bgCtx.beginPath();
    bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    bgCtx.fill();
    bgCtx.restore();
  }
}

for (let i = 0; i < 120; i++) particles.push(new Particle());

function animateBg() {
  bgCtx.clearRect(0, 0, W, H);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animateBg);
}
animateBg();

// ========== カードのイラスト描画関数 ==========
function drawSalad(ctx, w, h) {
  const cx = w/2, cy = h/2;
  // 大きな葉
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx, cy+12);
  ctx.bezierCurveTo(cx-14,cy+4, cx-16,cy-8, cx-6,cy-14);
  ctx.bezierCurveTo(cx+4,cy-20, cx+16,cy-12, cx+14,cy-2);
  ctx.bezierCurveTo(cx+12,cy+8, cx,cy+12, cx,cy+12);
  ctx.fillStyle = 'rgba(76,175,80,0.25)';
  ctx.strokeStyle = 'rgba(56,142,60,0.7)';
  ctx.lineWidth = 1.5;
  ctx.fill(); ctx.stroke();
  ctx.restore();
  // トマト
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx-8, cy+2, 7, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(244,67,54,0.5)';
  ctx.strokeStyle = 'rgba(211,47,47,0.8)';
  ctx.lineWidth = 1.2;
  ctx.fill(); ctx.stroke();
  // へた
  ctx.beginPath();
  ctx.moveTo(cx-10, cy-5); ctx.lineTo(cx-8, cy-8); ctx.lineTo(cx-6, cy-5);
  ctx.strokeStyle = 'rgba(56,142,60,0.9)';
  ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

function drawIka(ctx, w, h) {
  const cx = w/2, cy = h/2;
  // 胴体
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx, cy-16);
  ctx.bezierCurveTo(cx-10,cy-16, cx-12,cy-8, cx-12,cy);
  ctx.bezierCurveTo(cx-12,cy+10, cx-8,cy+14, cx,cy+14);
  ctx.bezierCurveTo(cx+8,cy+14, cx+12,cy+10, cx+12,cy);
  ctx.bezierCurveTo(cx+12,cy-8, cx+10,cy-16, cx,cy-16);
  ctx.fillStyle = 'rgba(200,200,240,0.4)';
  ctx.strokeStyle = 'rgba(100,100,200,0.7)';
  ctx.lineWidth = 1.5;
  ctx.fill(); ctx.stroke();
  // 触手
  const tentacles = [-8,-4,0,4,8];
  tentacles.forEach((tx, i) => {
    ctx.beginPath();
    ctx.moveTo(cx+tx, cy+14);
    ctx.bezierCurveTo(cx+tx+(i%2?3:-3), cy+20, cx+tx+(i%2?-2:2), cy+26, cx+tx, cy+30);
    ctx.strokeStyle = 'rgba(100,100,200,0.55)';
    ctx.lineWidth = 1.8; ctx.lineCap = 'round'; ctx.stroke();
  });
  ctx.restore();
}

function drawDuck(ctx, w, h) {
  const cx = w/2, cy = h/2;
  // 鴨肉
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx, cy+4, 16, 10, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(139,90,60,0.55)';
  ctx.strokeStyle = 'rgba(100,60,30,0.8)';
  ctx.lineWidth = 1.5; ctx.fill(); ctx.stroke();
  // 焼き目
  [cy, cy+4, cy+8].forEach((ly, i) => {
    ctx.beginPath();
    ctx.moveTo(cx-14, ly-2);
    ctx.bezierCurveTo(cx-7,ly-4, cx+7,ly-4, cx+14,ly-2);
    ctx.strokeStyle = `rgba(40,20,5,${0.7-i*0.15})`;
    ctx.lineWidth = 1.5+i*0.3; ctx.lineCap='round'; ctx.stroke();
  });
  // 山椒の実
  [[cx-8,cy-14],[cx+6,cy-16],[cx,cy-22]].forEach(([bx,by]) => {
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(100,180,60,0.85)';
    ctx.strokeStyle = 'rgba(56,142,60,0.9)';
    ctx.lineWidth = 0.8; ctx.fill(); ctx.stroke();
  });
  ctx.restore();
}

function drawTai(ctx, w, h) {
  const cx = w/2, cy = h/2;
  // 塩釜
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx-20, cy+12);
  ctx.bezierCurveTo(cx-22,cy-2, cx-18,cy-16, cx,cy-16);
  ctx.bezierCurveTo(cx+18,cy-16, cx+22,cy-2, cx+20,cy+12);
  ctx.fillStyle = 'rgba(245,240,228,0.65)';
  ctx.strokeStyle = 'rgba(200,185,150,0.8)';
  ctx.lineWidth = 1.5; ctx.fill(); ctx.stroke();
  // 鯛シルエット
  ctx.beginPath();
  ctx.ellipse(cx-2, cy-2, 13, 6, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,120,80,0.2)';
  ctx.strokeStyle = 'rgba(220,80,40,0.3)';
  ctx.lineWidth = 1; ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawRice(ctx, w, h) {
  const cx = w/2, cy = h/2;
  // 土鍋
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx-18, cy-2);
  ctx.lineTo(cx-18, cy+16);
  ctx.bezierCurveTo(cx-18,cy+21, cx-10,cy+24, cx,cy+24);
  ctx.bezierCurveTo(cx+10,cy+24, cx+18,cy+21, cx+18,cy+16);
  ctx.lineTo(cx+18, cy-2);
  ctx.fillStyle = 'rgba(190,150,100,0.35)';
  ctx.strokeStyle = 'rgba(140,100,60,0.7)';
  ctx.lineWidth = 1.5; ctx.fill(); ctx.stroke();
  // ごはん
  ctx.beginPath();
  ctx.ellipse(cx, cy-2, 15, 5, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,252,240,0.9)';
  ctx.fill();
  // 鯛の身
  ctx.beginPath();
  ctx.moveTo(cx-8, cy-5);
  ctx.bezierCurveTo(cx-4,cy-9, cx+4,cy-9, cx+8,cy-5);
  ctx.fillStyle = 'rgba(255,160,140,0.65)';
  ctx.fill();
  ctx.restore();
}

function drawCake(ctx, w, h) {
  const cx = w/2, cy = h/2;
  // ケーキ本体
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx-18, cy+14);
  ctx.lineTo(cx-18, cy+2);
  ctx.bezierCurveTo(cx-18,cy-10, cx-10,cy-16, cx,cy-16);
  ctx.bezierCurveTo(cx+10,cy-16, cx+18,cy-10, cx+18,cy+2);
  ctx.lineTo(cx+18, cy+14);
  ctx.fillStyle = 'rgba(255,220,160,0.5)';
  ctx.strokeStyle = 'rgba(210,160,80,0.7)';
  ctx.lineWidth = 1.5; ctx.fill(); ctx.stroke();
  // 中心の穴
  ctx.beginPath();
  ctx.moveTo(cx-7, cy+14);
  ctx.lineTo(cx-7, cy+2);
  ctx.bezierCurveTo(cx-7,cy-4, cx-3,cy-7, cx,cy-7);
  ctx.bezierCurveTo(cx+3,cy-7, cx+7,cy-4, cx+7,cy+2);
  ctx.lineTo(cx+7, cy+14);
  ctx.fillStyle = 'rgba(255,248,235,0.95)';
  ctx.fill();
  // いちご
  ctx.beginPath();
  ctx.moveTo(cx, cy-12);
  ctx.bezierCurveTo(cx-6,cy-12, cx-8,cy-6, cx-6,cy-2);
  ctx.bezierCurveTo(cx-4,cy+1, cx+4,cy+1, cx+6,cy-2);
  ctx.bezierCurveTo(cx+8,cy-6, cx+6,cy-12, cx,cy-12);
  ctx.fillStyle = 'rgba(244,67,54,0.7)';
  ctx.fill();
  ctx.restore();
}

// ========== カード生成 ==========
function buildCards() {
  const list = document.getElementById('menuList');
  MENU.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'menu-card';
    card.innerHTML = `
      <div class="card-canvas-wrap">
        <canvas width="110" height="110"></canvas>
      </div>
      <div class="card-body">
        <div class="card-course">【 ${item.course} 】</div>
        <div class="card-name">${item.name}</div>
        <div class="card-note">${item.note}</div>
      </div>
      <div class="card-number">0${idx+1}</div>
    `;
    list.appendChild(card);

    // イラスト描画
    const canvas = card.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    item.draw(ctx, 110, 110);

    // ホバーアニメーション
    let angle = 0;
    let animId = null;
    card.addEventListener('mouseenter', () => {
      if(animId) return;
      function animate() {
        ctx.clearRect(0,0,110,110);
        ctx.save();
        ctx.translate(55,55);
        ctx.rotate(Math.sin(angle)*0.04);
        ctx.translate(-55,-55);
        item.draw(ctx,110,110);
        ctx.restore();
        angle += 0.08;
        animId = requestAnimationFrame(animate);
      }
      animate();
    });
    card.addEventListener('mouseleave', () => {
      if(animId){ cancelAnimationFrame(animId); animId=null; }
      ctx.clearRect(0,0,110,110);
      item.draw(ctx,110,110);
      angle = 0;
    });

    // クリックでモーダル
    card.addEventListener('click', () => openModal(item));

    // 遅延付きで表示
    card.style.transitionDelay = `${idx * 0.12}s`;
  });
}

// ========== IntersectionObserver ==========
function observeCards() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting) {
        e.target.classList.add('in-view');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.menu-card').forEach(c => observer.observe(c));
}

// ========== モーダル ==========
function openModal(item) {
  document.getElementById('modalCourse').textContent = `【 ${item.course} 】`;
  document.getElementById('modalName').textContent = item.name;
  document.getElementById('modalDesc').innerHTML = item.desc.replace(/\n/g,'<br>');

  // モーダルパーティクル
  const mc = document.getElementById('modalCanvas');
  mc.width = document.getElementById('modalBox').offsetWidth || 380;
  mc.height = 300;
  const mctx = mc.getContext('2d');

  let mParticles = [];
  for(let i=0;i<40;i++){
    mParticles.push({
      x: Math.random()*mc.width,
      y: Math.random()*mc.height,
      r: Math.random()*1.5+0.3,
      speed: Math.random()*0.5+0.1,
      opacity: Math.random()*0.4+0.1,
      color: item.color
    });
  }

  let mAnimId;
  function animModal() {
    mctx.clearRect(0,0,mc.width,mc.height);
    mParticles.forEach(p => {
      p.y -= p.speed;
      if(p.y < 0) p.y = mc.height;
      mctx.save();
      mctx.globalAlpha = p.opacity;
      mctx.fillStyle = p.color;
      mctx.shadowBlur = 6;
      mctx.shadowColor = p.color;
      mctx.beginPath();
      mctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      mctx.fill();
      mctx.restore();
    });
    mAnimId = requestAnimationFrame(animModal);
  }

  if(window._modalAnimId) cancelAnimationFrame(window._modalAnimId);
  animModal();
  window._modalAnimId = mAnimId;

  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if(e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
    if(window._modalAnimId) cancelAnimationFrame(window._modalAnimId);
  }
}

// ========== 初期化 ==========
window.addEventListener('load', () => {
  buildCards();

  setTimeout(() => {
    const loading = document.getElementById('loading');
    loading.style.opacity = '0';
    setTimeout(() => {
      loading.style.display = 'none';
      document.getElementById('main').classList.add('visible');
      setTimeout(observeCards, 300);
    }, 800);
  }, 2000);
});
</script>
